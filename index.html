<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist de Acessos — Porto Vale</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14; --bg2: #13161e; --bg3: #1a1e28;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
      --text: #e8eaf0; --text2: #8b90a0; --text3: #555a6b;
      --accent: #5b8df6; --accent2: #3d6de0; --accent-glow: rgba(91,141,246,0.18);
      --green: #3ecf8e; --green-bg: rgba(62,207,142,0.1);
      --amber: #f5a623; --red: #f05252;
      --radius: 12px; --radius-sm: 8px;
      --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
    .bg-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(91,141,246,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(91,141,246,0.03) 1px, transparent 1px); background-size: 40px 40px; }
    header { position: sticky; top: 0; z-index: 100; background: rgba(13,15,20,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .header-inner { max-width: 780px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon { color: var(--accent); font-size: 16px; }
    .logo-text { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; }
    .header-title { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: 0.02em; }
    .btn-history { display: flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); font-family: var(--font); font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.18s; }
    .btn-history:hover { color: var(--text); border-color: var(--accent); }
    main { max-width: 780px; margin: 0 auto; padding: 24px 24px 60px; position: relative; z-index: 1; }
    main.hidden { display: none; }
    .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .type-btn { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg2); border: 1.5px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.2s; font-family: var(--font); }
    .type-btn:hover { border-color: var(--border2); background: var(--bg3); }
    .type-btn.active { border-color: var(--accent); background: var(--accent-glow); box-shadow: 0 0 20px rgba(91,141,246,0.1); }
    .type-icon { font-size: 22px; }
    .type-info { display: flex; flex-direction: column; gap: 1px; text-align: left; }
    .type-label { font-size: 14px; font-weight: 600; color: var(--text); }
    .type-count { font-size: 11px; color: var(--text3); font-family: var(--mono); }
    .type-btn.active .type-count { color: var(--accent); }
    .form-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .form-meta { display: grid; grid-template-columns: 1fr 1fr 140px 160px; gap: 12px; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; }
    .field input, .field select { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); font-family: var(--font); font-size: 13px; padding: 8px 11px; border-radius: var(--radius-sm); transition: border-color 0.18s; outline: none; width: 100%; }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--text3); }
    .field select option { background: var(--bg3); }
    .divider { height: 1px; background: var(--border); margin-bottom: 18px; }
    .checklist-area { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; margin-bottom: 20px; }
    .checklist-section h4 { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; padding-left: 2px; }
    .checklist-items { display: flex; flex-direction: column; gap: 3px; }
    .check-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s; border: 1px solid transparent; user-select: none; }
    .check-item:hover { background: var(--bg3); border-color: var(--border); }
    .check-item.checked { background: var(--green-bg); border-color: rgba(62,207,142,0.2); }
    .check-box { width: 16px; height: 16px; flex-shrink: 0; border: 1.5px solid var(--border2); border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: var(--bg3); }
    .check-item.checked .check-box { background: var(--green); border-color: var(--green); }
    .check-box svg { display: none; }
    .check-item.checked .check-box svg { display: block; }
    .check-label { font-size: 13px; color: var(--text); transition: color 0.15s; }
    .check-item.checked .check-label { color: var(--text2); text-decoration: line-through; }
    .progress-bar-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .progress-bar-bg { flex: 1; height: 4px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.3s ease; width: 0%; }
    .progress-label { font-size: 12px; color: var(--text2); font-family: var(--mono); min-width: 48px; text-align: right; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-clear { background: transparent; border: 1px solid var(--border2); color: var(--text2); font-family: var(--font); font-size: 13px; padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.18s; }
    .btn-clear:hover { color: var(--text); border-color: var(--border); }
    .btn-save { display: flex; align-items: center; gap: 7px; border: none; font-family: var(--font); font-size: 13px; font-weight: 500; padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.18s; background: var(--accent); color: #fff; }
    .btn-save:hover { background: var(--accent2); transform: translateY(-1px); }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .hero-nav { display: flex; align-items: center; gap: 16px; justify-content: space-between; margin-bottom: 20px; }
    .hero-nav h2 { font-size: 18px; font-weight: 600; }
    .hero-nav-actions { display: flex; align-items: center; gap: 10px; }
    .btn-back { display: flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); font-family: var(--font); font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.18s; }
    .btn-back:hover { color: var(--text); }
    .btn-danger-sm { background: transparent; border: 1px solid rgba(240,82,82,0.3); color: var(--red); font-family: var(--font); font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.18s; }
    .btn-danger-sm:hover { background: rgba(240,82,82,0.08); }
    .btn-export { display: flex; align-items: center; gap: 7px; background: linear-gradient(135deg, rgba(62,207,142,0.15), rgba(62,207,142,0.08)); border: 1px solid rgba(62,207,142,0.35); color: var(--green); font-family: var(--font); font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; }
    .btn-export:hover { background: linear-gradient(135deg, rgba(62,207,142,0.25), rgba(62,207,142,0.14)); border-color: rgba(62,207,142,0.6); box-shadow: 0 0 12px rgba(62,207,142,0.15); transform: translateY(-1px); }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }
    .history-loading { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .history-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.18s; }
    .history-card:hover { border-color: var(--border2); background: var(--bg3); }
    .history-badge { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 99px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.06em; }
    .badge-gerente { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(91,141,246,0.25); }
    .badge-vendedor { background: var(--green-bg); color: var(--green); border: 1px solid rgba(62,207,142,0.25); }
    .history-info { flex: 1; }
    .history-name { font-size: 14px; font-weight: 500; color: var(--text); }
    .history-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .history-progress { text-align: right; }
    .history-pct { font-size: 17px; font-weight: 600; color: var(--green); font-family: var(--mono); }
    .history-pct.partial { color: var(--amber); }
    .history-pct-label { font-size: 10px; color: var(--text3); }
    .setup-banner { background: linear-gradient(135deg, rgba(91,141,246,0.1), rgba(91,141,246,0.05)); border: 1px solid rgba(91,141,246,0.3); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 12px; }
    .setup-banner.hidden { display: none; }
    .setup-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }
    .setup-text { flex: 1; }
    .setup-text strong { font-size: 13px; color: var(--accent); display: block; margin-bottom: 4px; }
    .setup-text p { font-size: 12px; color: var(--text2); line-height: 1.5; }
    .setup-text code { font-family: var(--mono); font-size: 11px; background: var(--bg3); padding: 1px 5px; border-radius: 3px; }
    .setup-input-row { display: flex; gap: 8px; margin-top: 10px; }
    .setup-input { flex: 1; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 11px; padding: 7px 10px; border-radius: var(--radius-sm); outline: none; }
    .setup-input:focus { border-color: var(--accent); }
    .setup-input::placeholder { color: var(--text3); }
    .btn-setup-save { background: var(--accent); color: #fff; border: none; font-family: var(--font); font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; transition: background 0.18s; }
    .btn-setup-save:hover { background: var(--accent2); }
    .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.hidden { display: none; }
    .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); width: 100%; max-width: 540px; max-height: 80vh; overflow-y: auto; animation: modal-in 0.2s ease; }
    @keyframes modal-in { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 14px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { font-size: 15px; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--text2); font-size: 15px; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
    .modal-close:hover { background: var(--bg3); color: var(--text); }
    .modal-body { padding: 18px 22px 22px; }
    .modal-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
    .modal-meta-item label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 2px; }
    .modal-meta-item span { font-size: 13px; color: var(--text); }
    .modal-section-title { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin: 14px 0 6px; }
    .modal-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .modal-item:last-child { border-bottom: none; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-ok { background: var(--green); } .dot-no { background: var(--text3); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border2); color: var(--text); font-size: 13px; padding: 10px 20px; border-radius: 99px; z-index: 300; animation: toast-in 0.25s ease; white-space: nowrap; }
    .toast.hidden { display: none; }
    .toast.success { border-color: rgba(62,207,142,0.4); color: var(--green); }
    .toast.error { border-color: rgba(240,82,82,0.4); color: var(--red); }
    @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @media (max-width: 640px) {
      .form-meta { grid-template-columns: 1fr 1fr; }
      .checklist-area { grid-template-columns: 1fr; }
      .header-title { display: none; }
      .hero-nav-actions { flex-direction: column; align-items: flex-end; gap: 6px; }
    }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">Porto Vale</span>
    </div>
    <div class="header-title">Checklist de Acessos</div>
    <button class="btn-history" onclick="showPage('history')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Histórico
    </button>
  </div>
</header>

<main id="page-form">
  <div class="type-selector">
    <button class="type-btn active" id="btn-gerente" onclick="selectType('gerente')">
      <span class="type-icon">👔</span>
      <div class="type-info"><span class="type-label">Gerente</span><span class="type-count">14 acessos</span></div>
    </button>
    <button class="type-btn" id="btn-vendedor" onclick="selectType('vendedor')">
      <span class="type-icon">🤝</span>
      <div class="type-info"><span class="type-label">Vendedor</span><span class="type-count">5 acessos</span></div>
    </button>
  </div>
  <div class="form-card">
    <div class="form-meta">
      <div class="field"><label>Nome do colaborador</label><input type="text" id="nome" placeholder="Ex: João Silva" autocomplete="off" /></div>
      <div class="field"><label>Responsável</label><input type="text" id="responsavel" placeholder="Ex: Maria Gestão" autocomplete="off" /></div>
      <div class="field"><label>Data</label><input type="date" id="data" /></div>
      <div class="field"><label>Motivo</label><select id="motivo"><option value="">Selecione</option><option>Desligamento</option><option>Afastamento</option></select></div>
    </div>
    <div class="divider"></div>
    <div class="checklist-area" id="checklist-area"></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">0 / 0</span>
    </div>
    <div class="field" style="margin-bottom:16px"><label>Observações</label><input type="text" id="obs" placeholder="Opcional..." autocomplete="off" /></div>
    <div class="form-actions">
      <button class="btn-clear" onclick="clearForm()">Limpar</button>
      <button class="btn-save" id="btn-save" onclick="saveRecord()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Salvar registro
      </button>
    </div>
  </div>
</main>

<main id="page-history" class="hidden">
  <div class="setup-banner" id="setup-banner">
    <span class="setup-icon">⚙️</span>
    <div class="setup-text">
      <strong>Configure o Google Sheets para salvar em nuvem</strong>
      <p>Cole a URL do seu Apps Script Web App abaixo. Veja o arquivo <code>LEIA-ME.md</code> para o passo a passo completo.</p>
      <div class="setup-input-row">
        <input class="setup-input" id="api-url-input" placeholder="https://script.google.com/macros/s/.../exec" />
        <button class="btn-setup-save" onclick="saveApiUrl()">Salvar URL</button>
      </div>
    </div>
  </div>
  <div class="hero-nav">
    <button class="btn-back" onclick="showPage('form')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar
    </button>
    <h2>Histórico de registros</h2>
    <div class="hero-nav-actions">
      <button class="btn-export" onclick="exportXLSX()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar .xlsx
      </button>
      <button class="btn-danger-sm" onclick="clearHistory()">Limpar tudo</button>
    </div>
  </div>
  <div id="history-list" class="history-list"></div>
</main>

<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header"><h3 id="modal-title"></h3><button onclick="closeModal()" class="modal-close">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const API_URL_KEY = "portovale_api_url";
function getApiUrl() { return localStorage.getItem(API_URL_KEY) || ""; }
function saveApiUrl() {
  const url = document.getElementById("api-url-input").value.trim();
  if (!url.startsWith("https://script.google.com")) { showToast("URL inválida.", "error"); return; }
  localStorage.setItem(API_URL_KEY, url);
  document.getElementById("setup-banner").classList.add("hidden");
  showToast("URL salva! ✓", "success");
  renderHistory();
}

const ACESSOS = {
  gerente: [
    { secao: "Grupos", itens: ["Grupo Comunicados","Grupo Porto Vale","Grupo Pendências","Grupo NPS","Grupo Gerentes","Grupo Sistema – Clauser"] },
    { secao: "Sistemas e Acessos", itens: ["Inadimplentes","Ololu","Click Play","Acesso NPS","Acesso ao Sys Control","Portal","Power BI","Corretor Online"] }
  ],
  vendedor: [
    { secao: "Grupos", itens: ["Grupo Comunicados","Grupo Porto Vale"] },
    { secao: "Sistemas e Acessos", itens: ["Ololu","COL","Portal"] }
  ]
};

let currentType = "gerente";
let checkedItems = {};
let cachedHistory = [];

function selectType(type) {
  currentType = type; checkedItems = {};
  document.getElementById("btn-gerente").classList.toggle("active", type === "gerente");
  document.getElementById("btn-vendedor").classList.toggle("active", type === "vendedor");
  renderChecklist(); updateProgress();
}

function renderChecklist() {
  const area = document.getElementById("checklist-area");
  area.innerHTML = "";
  ACESSOS[currentType].forEach(({ secao, itens }) => {
    const section = document.createElement("div"); section.className = "checklist-section";
    const title = document.createElement("h4"); title.textContent = secao; section.appendChild(title);
    const itemsDiv = document.createElement("div"); itemsDiv.className = "checklist-items";
    itens.forEach(item => {
      const key = `${currentType}__${item}`;
      const div = document.createElement("div");
      div.className = "check-item" + (checkedItems[key] ? " checked" : "");
      div.onclick = () => toggleItem(key, div);
      div.innerHTML = `<div class="check-box"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 6 5 9 10 3"/></svg></div><span class="check-label">${item}</span>`;
      itemsDiv.appendChild(div);
    });
    section.appendChild(itemsDiv); area.appendChild(section);
  });
}

function toggleItem(key, el) {
  checkedItems[key] = !checkedItems[key];
  el.classList.toggle("checked", checkedItems[key]);
  updateProgress();
}

function updateProgress() {
  const total = ACESSOS[currentType].reduce((acc, s) => acc + s.itens.length, 0);
  const done = Object.values(checkedItems).filter(Boolean).length;
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-label").textContent = `${done} / ${total}`;
}

function clearForm() {
  checkedItems = {};
  ["nome","responsavel","obs"].forEach(id => { const el = document.getElementById(id); if(el) el.value = ""; });
  document.getElementById("data").value = new Date().toISOString().split("T")[0];
  document.getElementById("motivo").value = "";
  renderChecklist(); updateProgress();
}

async function saveRecord() {
  const nome = document.getElementById("nome").value.trim();
  const data = document.getElementById("data").value;
  if (!nome) { showToast("Informe o nome do colaborador.", "error"); return; }
  if (!data)  { showToast("Informe a data.", "error"); return; }
  const apiUrl = getApiUrl();
  if (!apiUrl) { showToast("Configure a URL do Apps Script primeiro.", "error"); showPage("history"); return; }

  const total = ACESSOS[currentType].reduce((acc, s) => acc + s.itens.length, 0);
  const done = Object.values(checkedItems).filter(Boolean).length;
  const record = {
    id: Date.now(), tipo: currentType, nome,
    responsavel: document.getElementById("responsavel").value.trim(),
    data, motivo: document.getElementById("motivo").value,
    obs: document.getElementById("obs").value.trim(),
    totalItens: total, done, itens: {}
  };
  ACESSOS[currentType].forEach(({ itens }) => {
    itens.forEach(item => { record.itens[item] = !!checkedItems[`${currentType}__${item}`]; });
  });

  const btn = document.getElementById("btn-save");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner" style="border-color:rgba(255,255,255,0.3);border-top-color:#fff"></span> Salvando...`;
  try {
    const res = await fetch(apiUrl, { method: "POST", body: JSON.stringify({ action: "save", record }) });
    const json = await res.json();
    if (json.status === "ok") { showToast("Registro salvo na planilha! ✓", "success"); clearForm(); }
    else throw new Error(json.error || "Erro desconhecido");
  } catch (e) { showToast("Erro ao salvar: " + e.message, "error"); }
  finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Salvar registro`;
  }
}

async function renderHistory() {
  const list = document.getElementById("history-list");
  const apiUrl = getApiUrl();
  const banner = document.getElementById("setup-banner");
  if (!apiUrl) {
    banner.classList.remove("hidden");
    list.innerHTML = '<div class="history-empty">Configure a URL do Apps Script acima para ver o histórico.</div>';
    return;
  }
  banner.classList.add("hidden");
  list.innerHTML = '<div class="history-loading"><div class="spinner"></div> Carregando registros...</div>';
  try {
    const res = await fetch(apiUrl + "?action=list");
    const json = await res.json();
    if (json.status !== "ok") throw new Error(json.error);
    cachedHistory = json.records || [];
  } catch(e) { list.innerHTML = `<div class="history-empty">Erro ao carregar: ${e.message}</div>`; return; }
  if (cachedHistory.length === 0) { list.innerHTML = '<div class="history-empty">Nenhum registro salvo ainda.</div>'; return; }
  list.innerHTML = cachedHistory.map(r => {
    const pct = r.totalItens === 0 ? 0 : Math.round((r.done / r.totalItens) * 100);
    const dataFmt = r.data ? new Date(r.data + "T12:00:00").toLocaleDateString("pt-BR") : "—";
    return `<div class="history-card" onclick="openModal(${r.id})">
      <span class="history-badge badge-${r.tipo}">${r.tipo}</span>
      <div class="history-info">
        <div class="history-name">${r.nome}</div>
        <div class="history-meta">${dataFmt}${r.motivo ? " · " + r.motivo : ""}${r.responsavel ? " · " + r.responsavel : ""}</div>
      </div>
      <div class="history-progress">
        <div class="history-pct ${pct === 100 ? "" : "partial"}">${pct}%</div>
        <div class="history-pct-label">${r.done}/${r.totalItens} itens</div>
      </div>
    </div>`;
  }).join("");
}

async function clearHistory() {
  if (!confirm("Apagar todo o histórico da planilha? Não pode ser desfeito.")) return;
  const apiUrl = getApiUrl();
  if (!apiUrl) return;
  try {
    const res = await fetch(apiUrl, { method: "POST", body: JSON.stringify({ action: "clear" }) });
    const json = await res.json();
    if (json.status === "ok") { cachedHistory = []; renderHistory(); showToast("Histórico apagado."); }
    else throw new Error(json.error);
  } catch(e) { showToast("Erro: " + e.message, "error"); }
}

function openModal(id) {
  const r = cachedHistory.find(x => x.id === id);
  if (!r) return;
  const dataFmt = r.data ? new Date(r.data + "T12:00:00").toLocaleDateString("pt-BR") : "—";
  const pct = r.totalItens === 0 ? 0 : Math.round((r.done / r.totalItens) * 100);
  document.getElementById("modal-title").textContent = r.nome;
  const sections = ACESSOS[r.tipo] || [];
  const itemsHtml = sections.map(({ secao, itens }) => `
    <div class="modal-section-title">${secao}</div>
    ${itens.map(item => `<div class="modal-item"><span class="dot ${r.itens[item] ? "dot-ok" : "dot-no"}"></span><span style="color:${r.itens[item] ? "var(--text)" : "var(--text3)"};${r.itens[item] ? "" : "text-decoration:line-through"}">${item}</span></div>`).join("")}`).join("");
  document.getElementById("modal-body").innerHTML = `
    <div class="modal-meta">
      <div class="modal-meta-item"><label>Tipo</label><span style="text-transform:capitalize">${r.tipo}</span></div>
      <div class="modal-meta-item"><label>Data</label><span>${dataFmt}</span></div>
      <div class="modal-meta-item"><label>Responsável</label><span>${r.responsavel || "—"}</span></div>
      <div class="modal-meta-item"><label>Motivo</label><span>${r.motivo || "—"}</span></div>
      <div class="modal-meta-item"><label>Conclusão</label><span style="color:${pct===100?"var(--green)":"var(--amber)"};font-weight:600">${pct}% (${r.done}/${r.totalItens})</span></div>
      ${r.obs ? `<div class="modal-meta-item" style="grid-column:span 2"><label>Observações</label><span>${r.obs}</span></div>` : ""}
    </div>${itemsHtml}`;
  document.getElementById("modal-overlay").classList.remove("hidden");
}

function closeModal() { document.getElementById("modal-overlay").classList.add("hidden"); }

function showPage(page) {
  document.getElementById("page-form").classList.toggle("hidden", page !== "form");
  document.getElementById("page-history").classList.toggle("hidden", page !== "history");
  if (page === "history") {
    const saved = getApiUrl();
    if (saved) document.getElementById("api-url-input").value = saved;
    renderHistory();
  }
}

function exportXLSX() {
  if (cachedHistory.length === 0) { showToast("Nenhum registro para exportar.", "error"); return; }
  const allItems = [...ACESSOS.gerente.flatMap(s => s.itens), ...ACESSOS.vendedor.flatMap(s => s.itens)];
  const uniqueItems = [...new Set(allItems)];
  const headers = ["Tipo","Nome","Responsável","Data","Motivo","Observações","Concluído (%)","Itens OK / Total",...uniqueItems];
  const rows = cachedHistory.map(r => {
    const dataFmt = r.data ? new Date(r.data + "T12:00:00").toLocaleDateString("pt-BR") : "";
    const pct = r.totalItens === 0 ? 0 : Math.round((r.done / r.totalItens) * 100);
    return [r.tipo.charAt(0).toUpperCase()+r.tipo.slice(1), r.nome, r.responsavel||"", dataFmt, r.motivo||"", r.obs||"", pct+"%", `${r.done}/${r.totalItens}`, ...uniqueItems.map(item => r.itens[item]===undefined?"N/A":r.itens[item]?"✓":"✗")];
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = headers.map((_,i) => ({ wch: [12,22,20,12,16,28,13,14][i]||22 }));
  ws['!freeze'] = { xSplit: 0, ySplit: 1 };
  XLSX.utils.book_append_sheet(wb, ws, "Registros");
  const total = cachedHistory.length;
  const mediaConc = total ? Math.round(cachedHistory.reduce((a,r)=>a+(r.totalItens?r.done/r.totalItens*100:0),0)/total) : 0;
  const wsSummary = XLSX.utils.aoa_to_sheet([
    ["📊 Resumo",""],["",""],["Total de registros",total],
    ["Gerentes",cachedHistory.filter(r=>r.tipo==="gerente").length],
    ["Vendedores",cachedHistory.filter(r=>r.tipo==="vendedor").length],["",""],
    ["Média de conclusão",mediaConc+"%"],
    ["100% completos",cachedHistory.filter(r=>r.totalItens&&r.done===r.totalItens).length],["",""],
    ["Gerado em",new Date().toLocaleString("pt-BR")]
  ]);
  wsSummary['!cols'] = [{wch:28},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsSummary, "Resumo");
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,"");
  XLSX.writeFile(wb, `checklist_acessos_${stamp}.xlsx`);
  showToast("Exportado em .xlsx ✓", "success");
}

let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast"+(type?" "+type:"");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hidden"), 3000);
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("data").value = new Date().toISOString().split("T")[0];
  const saved = getApiUrl();
  if (saved) document.getElementById("api-url-input").value = saved;
  renderChecklist(); updateProgress();
});
</script>
